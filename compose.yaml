# Runs the Altinn mock and Texas for Altinnator when it runs on your host (mise run dev:run). Texas gets Maskinporten
# tokens from the mock, and Altinnator reaches Texas on localhost:3000 and Altinn on localhost:8090
services:
  altinn-mock:
    build:
      context: .
      dockerfile: Dockerfile.altinnmock
    ports:
      - "8090:8090"

  texas:
    image: ghcr.io/nais/texas:2026-11-05-083041-a994632@sha256:f2476eba671fc289a1268feef5c5a1fbe6fc0a266ec9f990038d059aa90ce678
    depends_on:
      - altinn-mock
    # Texas fetches the mock's metadata and keys when it starts, and gives up if the mock is not up yet
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      BIND_ADDRESS: 0.0.0.0:3000
      MASKINPORTEN_ENABLED: "true"
      MASKINPORTEN_CLIENT_ID: dev-client
