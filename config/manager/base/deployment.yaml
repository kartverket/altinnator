apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: altinnator
  name: altinnator
  namespace: altinnator-system
spec:
  replicas: 2
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: altinnator
  template:
    metadata:
      labels:
        app: altinnator
    spec:
      automountServiceAccountToken: true
      initContainers:
        # Texas (https://github.com/nais/texas) gets Maskinporten tokens for Altinnator, so only Texas reads the
        # Maskinporten client's key. As a native sidecar, it starts before Altinnator and runs beside it.
        - env:
            # Loopback only, so only containers in this pod can get tokens
            - name: BIND_ADDRESS
              value: 127.0.0.1:3000
            - name: PROBE_BIND_ADDRESS
              value: 0.0.0.0:3001
            - name: MASKINPORTEN_ENABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: altinnator-texas
            - secretRef:
                name: altinnator-maskinporten
          image: ghcr.io/nais/texas
          name: texas
          ports:
            - containerPort: 3001
              name: texas-probes
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /healthz
              port: texas-probes
      containers:
        - args:
            - -d
            - -leader-elect
            - -metrics-bind-address=0.0.0.0:8181
            - -metrics-secure=false
          env:
            - name: GOMEMLIMIT
              value: "230MiB"
            # In the pod, localhost is the pod itself. host.docker.internal is your host, where the mock runs.
            - name: ALTINNATOR_ALTINN_PLATFORM_BASE_URL
              value: http://host.docker.internal:8090
          envFrom:
            - configMapRef:
                name: altinnator-env
          image: altinnator:latest
          imagePullPolicy: Never
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 30
          name: altinnator
          ports:
            - containerPort: 8181
              name: metrics
            - containerPort: 8081
              name: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 30
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
      imagePullSecrets:
        - name: github-auth
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: altinnator